<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hero Section — 3 Variants / Physifun</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800;900&family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="hero/hero-styles.css?v=4" />
<style>
  body { margin: 0; background: #ededed; font-family: "Noto Sans JP", sans-serif; }
  .stage-frame { background: #fff; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="hero/hero-variants.jsx"></script>
<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;

function App() {
  return (
    <DesignCanvas title="Physifun — Hero Section" subtitle="リーダー募集 LP / Section 01 — 3 案 × デスクトップ + モバイル">
      <DCSection id="A" title="案 A — 動画オーバーレイ型" subtitle="フルスクリーン動画 + 重ねテキスト。映像で『現場』に没入させる、CAMPFIRE 系のスケール感">
        <DCArtboard id="A-desktop" label="A / Desktop 1440" width={1440} height={820}>
          <div className="stage-frame" data-screen-label="Hero A — Desktop">
            <HeroA />
          </div>
        </DCArtboard>
        <DCArtboard id="A-mobile" label="A / Mobile 390" width={390} height={820}>
          <div className="stage-frame" data-screen-label="Hero A — Mobile">
            <HeroA mobile />
          </div>
        </DCArtboard>
      </DCSection>

      <DCSection id="B" title="案 B — 縦分割アシメ型" subtitle="左テキスト / 右動画 の 2 カラム。エディトリアル風で読み物としての強さ。マニフェスト引用を映像に重ねる">
        <DCArtboard id="B-desktop" label="B / Desktop 1440" width={1440} height={820}>
          <div className="stage-frame" data-screen-label="Hero B — Desktop">
            <HeroB />
          </div>
        </DCArtboard>
        <DCArtboard id="B-mobile" label="B / Mobile 390" width={390} height={1080}>
          <div className="stage-frame" data-screen-label="Hero B — Mobile">
            <HeroB mobile />
          </div>
        </DCArtboard>
      </DCSection>

      <DCSection id="C" title="案 C — グラデ統合型 + ファーストビュー CTA" subtitle="動画と赤背景をグラデで一枚絵に統合。ファーストビュー内に CTA + 由来表記をまとめてスクロール前に勝負">
        <DCArtboard id="C-desktop" label="C / Desktop 1440" width={1440} height={820}>
          <div className="stage-frame" data-screen-label="Hero C — Desktop">
            <HeroC />
          </div>
        </DCArtboard>
        <DCArtboard id="C-mobile" label="C / Mobile 390" width={390} height={920}>
          <div className="stage-frame" data-screen-label="Hero C — Mobile">
            <HeroC mobile />
          </div>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
