<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voice Section — 3 Variants / Physifun</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800;900&family=Shippori+Mincho:wght@500;700&family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="voice/voice-styles.css?v=1" />
<style>
  body { margin: 0; background: #ededed; font-family: "Noto Sans JP", sans-serif; }
  .stage-frame { background: #fff; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="voice/voice-variants.jsx"></script>
<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;

function App() {
  return (
    <DesignCanvas title="Physifun — Voice Section" subtitle="リーダー募集 LP / Section 05 — リーダーの声 3 案">
      <DCSection id="A" title="案 A — 引用フォーカス型 / クリーム" subtitle="3 名の引用を主役に。明朝で『言葉』を強く立てる、雑誌的な静かな構成">
        <DCArtboard id="A-desktop" label="A / Desktop 1440" width={1440} height={780}>
          <div className="stage-frame" data-screen-label="Voice A — Desktop">
            <VoiceA />
          </div>
        </DCArtboard>
        <DCArtboard id="A-mobile" label="A / Mobile 390" width={390} height={1500}>
          <div className="stage-frame" data-screen-label="Voice A — Mobile">
            <VoiceA mobile />
          </div>
        </DCArtboard>
      </DCSection>

      <DCSection id="B" title="案 B — 雑誌インタビュー型 / テラコッタ" subtitle="主役 1 件を写真大きめで掘り下げ + サムネ 2 件。物語を読ませる読み物的な構成">
        <DCArtboard id="B-desktop" label="B / Desktop 1440" width={1440} height={1340}>
          <div className="stage-frame" data-screen-label="Voice B — Desktop">
            <VoiceB />
          </div>
        </DCArtboard>
        <DCArtboard id="B-mobile" label="B / Mobile 390" width={390} height={1700}>
          <div className="stage-frame" data-screen-label="Voice B — Mobile">
            <VoiceB mobile />
          </div>
        </DCArtboard>
      </DCSection>

      <DCSection id="C" title="案 C — 数字 + 言葉カード型 / 砂 × 藍 × 柿" subtitle="先頭で実績の数字（リーダー数 / 満足度 / 集まった時間）を見せ、3 つの声に渡す。LP らしい説得力">
        <DCArtboard id="C-desktop" label="C / Desktop 1440" width={1440} height={1100}>
          <div className="stage-frame" data-screen-label="Voice C — Desktop">
            <VoiceC />
          </div>
        </DCArtboard>
        <DCArtboard id="C-mobile" label="C / Mobile 390" width={390} height={1900}>
          <div className="stage-frame" data-screen-label="Voice C — Mobile">
            <VoiceC mobile />
          </div>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
