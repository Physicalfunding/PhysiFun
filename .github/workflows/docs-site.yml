name: DB Docs Site (Pages)

# DB ドキュメントサイト（VitePress）と動く ER 図（Liam ERD）を作り、GitHub Pages に公開する（#273 / #280）。
# 公開先: https://physicalfunding.github.io/PhysiFun/（動く ER 図は /er/）
#
# - main への push で作り直して公開する。PR ではビルドできるかだけを確認する（公開しない）
# - リポジトリの Settings → Pages の Source は「GitHub Actions」（設定済み）
# - 手順の詳細は docs/guides/db-migration.md §6 を参照

on:
  push:
    branches:
      - main
    paths:
      - docs/db/**
      - docs/specs/02_domain-model.md
      - docs/specs/03_data-model.md
      - apps/docs-site/**
      - packages/infrastructure/scripts/db-erd.ts
      - .github/workflows/docs-site.yml
  pull_request:
    branches:
      - main
    paths:
      - docs/db/**
      - docs/specs/02_domain-model.md
      - docs/specs/03_data-model.md
      - apps/docs-site/**
      - packages/infrastructure/scripts/db-erd.ts
      - .github/workflows/docs-site.yml
  workflow_dispatch:

# 公開中のデプロイは途中で止めない（GitHub の推奨）。PR のビルドだけは新しいもので置き換える
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # VitePress と、Liam ERD の CLI（npx）を Node で動かす。バージョンは .nvmrc に合わせる
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 動く ER 図を dist/erd/ に作る。サイトのビルドが public/er/ にコピーして /er/ で配信する
      - name: Build Liam ERD
        working-directory: packages/infrastructure
        run: bun run db:erd

      - name: Build site
        working-directory: apps/docs-site
        run: bun run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs-site/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
