services:
  db:
    image: postgres:17
    container_name: physifun-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: crowfun_experience
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
